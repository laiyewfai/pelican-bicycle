<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pelican Riding a Bicycle</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#7ec8f7; }
  svg { display:block; width:100vw; height:100vh; }

  /* Only origin-independent animations live in CSS (pure translation,
     stroke-dashoffset). ALL rotations/scaling use SMIL animateTransform
     with explicit rotation centers, so nothing shifts when the
     viewport is resized or zoomed. */
  .cloudA  { animation: driftA 42s linear infinite; animation-delay:-14s; }
  .cloudB  { animation: driftA 55s linear infinite; animation-delay:-38s; }
  .cloudC  { animation: driftA 64s linear infinite; animation-delay:-52s; }
  @keyframes driftA { from { transform:translateX(1100px); } to { transform:translateX(-180px); } }

  #dash    { animation: dashMove .236s linear infinite; }
  /* dash speed synced to wheel surface speed: 130u per 0.236s = 439.8u/0.8s */
  @keyframes dashMove { from { stroke-dashoffset:0; } to { stroke-dashoffset:130; } }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc0f5"/>
      <stop offset="0.75" stop-color="#cdeeff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0"   stop-color="#ffe9a0" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffe9a0" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <g id="cloudDef" fill="#ffffff" opacity="0.92">

      <ellipse cx="0"  cy="0"   rx="48" ry="20"/>
      <ellipse cx="34" cy="-14" rx="30" ry="17"/>
      <ellipse cx="66" cy="-2"  rx="27" ry="14"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="url(#sky)"/>

  <g transform="translate(130 90)">
    <!-- scale about local origin = sun center; wrapper makes it zoom-proof -->
    <g>
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.08;1" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
      <circle r="70" fill="url(#glow)"/>
      <circle r="34" fill="#ffd94d"/>
    </g>
  </g>

  <g transform="translate(0,70)  scale(0.9)"><use href="#cloudDef" class="cloudA"/></g>
  <g transform="translate(0,140) scale(0.65)"><use href="#cloudDef" class="cloudB"/></g>
  <g transform="translate(0,35)  scale(0.5)"><use href="#cloudDef" class="cloudC"/></g>

  <text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="30"
        font-weight="bold" fill="#23527c" letter-spacing="3">&#128694; PELICAN ON WHEELS &#128694;</text>
  <!-- Road & grass -->
  <rect x="0" y="440" width="900" height="30" fill="#54545e"/>
  <rect x="0" y="440" width="900" height="5"  fill="#3f3f49"/>
  <line id="dash" x1="-200" y1="462" x2="1100" y2="462"
        stroke="#f4f4f4" stroke-width="7" stroke-dasharray="55 75"/>
  <rect x="0" y="470" width="900" height="30" fill="#7fbf5a"/>

  <!-- Ground shadow -->
  <ellipse cx="412" cy="449" rx="215" ry="8" fill="rgba(0,0,0,0.18)"/>

  <!-- FAR leg (behind everything). Hip is moved to the local origin by the
       wrapper translate, so rotate+scale SMIL transforms pivot exactly there.
       Precomputed vs the crank (BB 360,370 / r=28 / hip 340,250 / leg 122):
       foot tracks the pedal that starts at the BOTTOM, offset 180deg from near. -->
  <g transform="translate(340 250)">
    <g id="legFar">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="-7.70;-0.08;3.81;0.11;-12.26;-21.66;-21.80;-15.90;-7.70"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        dur="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1 1.224;1 1.146;1 0.986;1 0.821;1 0.772;1 0.884;1 1.059;1 1.191;1 1.224"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        dur="0.8s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="122" stroke="#e8930c" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="4" cy="122" rx="15" ry="6" fill="#e8930c"/>
    </g>
  </g>

  <!-- Wheels -->
  <g>
    <circle cx="250" cy="370" r="70" fill="#f2f2f2" stroke="#2b2b2b" stroke-width="11"/>
    <circle cx="250" cy="370" r="58" fill="none" stroke="#9a9a9a" stroke-width="3"/>
    <g id="spokesB" stroke="#8a8a8a" stroke-width="3.5">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 250 370" to="360 250 370" dur="0.8s" repeatCount="indefinite"/>
      <line x1="250" y1="306" x2="250" y2="434"/>
      <line x1="186" y1="370" x2="314" y2="370"/>
      <line x1="202" y1="322" x2="298" y2="418"/>
      <line x1="202" y1="418" x2="298" y2="322"/>
      <circle cx="288" cy="370" r="3.5" fill="#555" stroke="none"/>
    </g>
    <circle cx="250" cy="370" r="10" fill="#d33" stroke="#7a1f1f" stroke-width="3"/>
  </g>
  <g>
    <circle cx="570" cy="370" r="70" fill="#f2f2f2" stroke="#2b2b2b" stroke-width="11"/>
    <circle cx="570" cy="370" r="58" fill="none" stroke="#9a9a9a" stroke-width="3"/>
    <g id="spokesF" stroke="#8a8a8a" stroke-width="3.5">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 570 370" to="360 570 370" dur="0.8s" repeatCount="indefinite"/>
      <line x1="570" y1="306" x2="570" y2="434"/>
      <line x1="506" y1="370" x2="634" y2="370"/>
      <line x1="522" y1="322" x2="618" y2="418"/>
      <line x1="522" y1="418" x2="618" y2="322"/>
      <circle cx="608" cy="370" r="3.5" fill="#555" stroke="none"/>
    </g>
    <circle cx="570" cy="370" r="10" fill="#d33" stroke="#7a1f1f" stroke-width="3"/>
  </g>

  <!-- Frame: every joint meets at a real coordinate
       R=(250,370) BB=(360,370) F=(570,370) S=(330,252) HT=(532,252) HB=(548,290) -->
  <path d="M 250 370 L 330 252 L 360 370 L 250 370
           M 330 252 L 532 252 L 548 290 L 570 370
           M 360 370 L 548 290"
        fill="none" stroke="#e63946" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handlebar + seat -->
  <path d="M 532 252 L 524 224 L 494 220" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <circle cx="494" cy="220" r="5.5" fill="#222"/>
  <rect x="300" y="238" width="62" height="13" rx="7" fill="#222" transform="rotate(-4 331 244)"/>

  <!-- Crank + pedals (pedals counter-rotate about their own centers to stay level) -->
  <g id="crank">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 360 370" to="360 360 370" dur="0.8s" repeatCount="indefinite"/>
    <line x1="360" y1="370" x2="360" y2="342" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <line x1="360" y1="370" x2="360" y2="398" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalT" x="344" y="337.5" width="32" height="9" rx="4" fill="#222">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 360 342" to="-360 360 342" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect id="pedalB" x="344" y="393.5" width="32" height="9" rx="4" fill="#222">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 360 398" to="-360 360 398" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- The Pelican -->
  <g id="pelicanG">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -4;0 0" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    <path d="M 254 170 L 190 198 L 250 214 Z" fill="#e2e8f0"/>
    <ellipse cx="315" cy="190" rx="80" ry="52" fill="#fbfbfd" transform="rotate(-8 315 190)"/>
    <!-- wing pivots about (268,174) via wrapper -->
    <g transform="translate(268 174)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="-6;8;-6" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="35" cy="22" rx="47" ry="28" fill="#e2e8f0" stroke="#cfd8e4" stroke-width="2"/>
    </g>
    <path d="M 362 168 C 382 138 392 116 404 94" fill="none"
          stroke="#fbfbfd" stroke-width="26" stroke-linecap="round"/>
    <!-- head pivots about (400,110) via wrapper -->
    <g transform="translate(400 110)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="-2;3;-2" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="15" cy="-25" r="23" fill="#fbfbfd"/>
      <path d="M -8 -30 Q 14 -60 38 -32 L 38 -26 Q 15 -36 -8 -24 Z" fill="#e63946"/>
      <circle cx="24" cy="-31" r="4.5" fill="#222"/>
      <circle cx="25.5" cy="-32.5" r="1.5" fill="#fff"/>
      <path d="M 33 -34 L 106 -23 L 103 -16 L 34 -22 Z" fill="#f4a340"/>
      <!-- pouch wobbles about its attachment point (34,-22) in head-local coords -->
      <g transform="translate(34 -22)">
        <animateTransform attributeName="transform" type="rotate" additive="sum"
                          values="0;4;0" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
        <path d="M 2 0 Q 29 44 69 5 L 0 2 Z" fill="#f6b45a"/>
      </g>
    </g>
  </g>

  <!-- NEAR leg (in front of body/frame), same origin-proof structure.
       Foot tracks the pedal that starts at the TOP: bottom is its same
       8-keyframe set paired with the crank phase. -->
  <g transform="translate(340 250)">
    <g id="legNear">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="-12.26;-21.66;-21.80;-15.90;-7.70;-0.08;3.81;0.11;-12.26"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        dur="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1 0.772;1 0.884;1 1.059;1 1.191;1 1.224;1 1.146;1 0.986;1 0.821;1 0.772"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        dur="0.8s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="122" stroke="#f4a340" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="5" cy="122" rx="16" ry="6.5" fill="#f4a340"/>
    </g>
  </g>
</svg>
</body>
</html>
